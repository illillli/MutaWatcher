name: Mutamarket Monitor

# 設定觸發條件
on:
  schedule:
    # 邏輯設定：每 10 分鐘執行一次。
    # 說明：GitHub Actions 的 cron 不保證秒級精準，若設 5 分鐘可能導致兩次任務重疊衝突。
    - cron: '*/10 * * * *'
  workflow_dispatch: # 允許在 GitHub 網頁上手動點擊執行測試

# 賦予寫入權限，讓腳本可以將 notified.txt 存回儲存庫
permissions:
  contents: write

jobs:
  check-market:
    runs-on: ubuntu-latest
    steps:
      - name: 下載儲存庫程式碼
        uses: actions/checkout@v4
        
      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip' # 快取依賴套件，加快執行速度
          
      - name: 安裝依賴套件
        run: pip install -r requirements.txt
        
      - name: 執行監控腳本
        # 將 GitHub Secrets 注入為環境變數供 Python 讀取
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python main.py
        
      - name: 提交並推送更新後的狀態檔案
        # 如果 notified.txt 有被修改，就自動 git commit 並推回 GitHub
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add notified.txt
          git diff-index --quiet HEAD || (git commit -m "chore: 更新已通知合約清單 [skip ci]" && git push)
